<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>방문자 통계</title>
  <style>
    :root { --bg:#f4fbf8; --surface:#fff; --primary:#047857; --border:#d9e7df; --text:#14231f; --muted:#64746f; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Noto Sans KR',system-ui,sans-serif; background:var(--bg); color:var(--text); line-height:1.6; }
    main { width:min(960px,calc(100% - 32px)); margin:0 auto; padding:32px 0 56px; }
    h1 { margin:0 0 4px; font-size:28px; }
    .sub { margin:0 0 24px; color:var(--muted); font-size:14px; }
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; margin-bottom:24px; }
    .card, .panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:18px 20px; }
    .card b { display:block; font-size:34px; color:var(--primary); line-height:1.2; }
    .card span { color:var(--muted); font-size:13px; }
    .panel { margin-bottom:20px; overflow-x:auto; }
    h2 { margin:0 0 12px; font-size:18px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:right; white-space:nowrap; }
    th:first-child, td:first-child { text-align:left; white-space:normal; word-break:break-all; }
    th { color:var(--muted); font-weight:600; }
    a { color:var(--primary); }
    #msg { color:#b45309; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f1a17; --surface:#16251f; --border:#27403a; --text:#e6f0ec; --muted:#93a8a0; --primary:#34d399; }
    }
  </style>
</head>
<body>
<main>
  <h1>방문자 통계</h1>
  <p class="sub">기준일 <span id="date">-</span> (한국 시간) · <a href="./">자료 목록으로</a></p>
  <p id="msg" role="status"></p>

  <section class="cards" aria-label="요약">
    <div class="card"><b id="total">-</b><span>전체 방문(페이지뷰)</span></div>
    <div class="card"><b id="today">-</b><span>오늘 방문(페이지뷰)</span></div>
    <div class="card"><b id="todayVisitors">-</b><span>오늘 방문자(순 방문자)</span></div>
  </section>

  <section class="panel">
    <h2>페이지별 방문 수</h2>
    <table>
      <thead><tr><th>페이지</th><th>오늘</th><th>전체</th></tr></thead>
      <tbody id="pages"><tr><td colspan="3">불러오는 중…</td></tr></tbody>
    </table>
  </section>

  <section class="panel">
    <h2>최근 7일</h2>
    <table>
      <thead><tr><th>날짜</th><th>방문</th><th>순 방문자</th></tr></thead>
      <tbody id="daily"></tbody>
    </table>
  </section>

  <section class="panel" id="recentPanel" hidden>
    <h2>최근 접속 기록</h2>
    <table>
      <thead><tr><th>페이지</th><th>시각</th><th>국가</th><th>유입</th></tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </section>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var fmt = function (n) { return Number(n).toLocaleString('ko-KR'); };
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var key = new URLSearchParams(location.search).get('key');
  fetch('/api/stats' + (key ? '?key=' + encodeURIComponent(key) : ''), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      $('date').textContent = d.date;
      $('total').textContent = fmt(d.total);
      $('today').textContent = fmt(d.today);
      $('todayVisitors').textContent = fmt(d.todayVisitors);
      $('pages').innerHTML = d.pages.length ? d.pages.map(function (p) {
        return '<tr><td><a href="' + esc(encodeURI(p.path)) + '">' + esc(p.path) + '</a></td><td>' + fmt(p.today) + '</td><td>' + fmt(p.total) + '</td></tr>';
      }).join('') : '<tr><td colspan="3">아직 기록이 없습니다.</td></tr>';
      $('daily').innerHTML = d.daily.slice().reverse().map(function (x) {
        return '<tr><td>' + x.date + '</td><td>' + fmt(x.views) + '</td><td>' + fmt(x.visitors) + '</td></tr>';
      }).join('');
      if (d.recent) {
        $('recentPanel').hidden = false;
        $('recent').innerHTML = d.recent.map(function (e) {
          return '<tr><td>' + esc(e.p) + '</td><td>' + new Date(e.t).toLocaleString('ko-KR') + '</td><td>' + esc(e.c || '-') + '</td><td>' + esc(e.r || '-') + '</td></tr>';
        }).join('');
      }
    })
    .catch(function () {
      $('msg').textContent = '통계를 불러오지 못했습니다. 저장소(Upstash Redis) 연결과 /api/stats 배포 여부를 확인하세요.';
      $('pages').innerHTML = '';
    });
})();
</script>
</body>
</html>
